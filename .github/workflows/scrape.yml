name: Scrape listings (manual verification only)

# MANUAL ONLY — not a production pipeline. The live site is refreshed and
# published by .github/workflows/pages.yml (every 3 hours); this workflow no
# longer has a schedule or a publish path, so the two can never compete.
#
# PRIVACY GUARD: scraped listings contain posters' personal details. The
# first step checks the repository's visibility; anything other than
# mode=verify is refused while the repository is public.
#
# mode=verify: scrape (+ optional screenshots), then push results ENCRYPTED
#   with .github/verify-pubkey.pem to `verify-output` (for private audits).
#   Facebook follows the same collection cooldown as production (it re-uses
#   the newest completed Bright Data snapshot while the cooldown runs), unless
#   facebook_snapshot names a snapshot.
#
# Logs contain counts and statuses only — never listing text, contacts,
# names or HTML. See scraper/index.js (logSummary).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify (the only mode; production publishing is pages.yml)'
        required: true
        default: verify
        type: choice
        options: [verify]
      screenshots:
        description: 'verify mode: render the site and screenshot it (true/false)'
        required: false
        default: 'false'
      facebook_snapshot:
        description: 'Facebook: reuse an existing Bright Data snapshot ("latest" or an id) instead of collecting; blank = normal'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'verify' }}
    steps:
      - name: Privacy guard (repository must be private to publish)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" != "true" ] && [ "$MODE" != "verify" ]; then
            echo "Repository is public: scraping/publishing is disabled until it is made private."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
      - run: npm test --silent > /dev/null && echo "tests passed"
        if: steps.guard.outputs.skip != 'true'

      - name: Scrape live sources
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "$MODE" = "verify" ]; then export DUMP_RETRIEVED="$RUNNER_TEMP/retrieved.json" FACEBOOK_DUMP_RAW="$RUNNER_TEMP/facebook-audit.json"; fi
          node scraper/index.js
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Facebook Groups via Bright Data. The key is a secret (masked in logs);
          # the scraper logs counts only.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          FACEBOOK_GROUPS: ${{ vars.FACEBOOK_GROUPS }}
          FACEBOOK_REUSE_SNAPSHOT: ${{ inputs.facebook_snapshot }}
          FACEBOOK_COLLECTION_COOLDOWN_HOURS: ${{ vars.FACEBOOK_COLLECTION_COOLDOWN_HOURS }}
          FACEBOOK_MONTHLY_RECORD_BUDGET: ${{ vars.FACEBOOK_MONTHLY_RECORD_BUDGET }}
          FACEBOOK_MONTHLY_SAFETY_BUFFER: ${{ vars.FACEBOOK_MONTHLY_SAFETY_BUFFER }}
          ENABLE_SOURCES: ${{ vars.ENABLE_SOURCES }}
          MAX_SHARE: ${{ vars.MAX_SHARE }}

      - name: Screenshot the site with real data
        if: steps.guard.outputs.skip != 'true' && env.MODE == 'verify' && inputs.screenshots == 'true'
        run: |
          npm install --no-save playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (PORT=3000 node server.js > /dev/null &) && sleep 2
          node scripts/screenshot.js

      - name: Encrypt results and push to verify-output
        if: steps.guard.outputs.skip != 'true' && env.MODE == 'verify'
        run: |
          set -euo pipefail
          mkdir -p out
          cp public/data/listings.json public/data/status.json out/
          [ -f "$RUNNER_TEMP/retrieved.json" ] && cp "$RUNNER_TEMP/retrieved.json" out/ || true
          [ -f "$RUNNER_TEMP/facebook-audit.json" ] && cp "$RUNNER_TEMP/facebook-audit.json" out/ || true
          node scripts/sanitize.js public/data out/sanitized
          [ -d shots ] && cp -r shots out/ || true
          tar czf results.tgz -C out .
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in results.tgz -out results.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/verify-pubkey.pem -in key.bin -out key.bin.enc
          rm key.bin results.tgz
          git config user.name "apartment-hunter-bot"
          git config user.email "apartment-hunter-bot@users.noreply.github.com"
          git checkout -q --orphan verify-output
          git rm -rqf --cached .
          git add -f results.tgz.enc key.bin.enc
          git commit -qm "Encrypted verification output ($(date -u +%FT%TZ))"
          git push -qf origin verify-output
          echo "pushed encrypted results"
